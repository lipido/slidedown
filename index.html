<!DOCTYPE html>
<!-- ============================================================
     SLIDEDOWN — punto de entrada
     Para abrir una presentación: edita slides.md y abre este
     archivo en el navegador. Para que funcione la carga de
     slides.md por fetch necesitas un servidor estático:
       python3 -m http.server
     Alternativa sin servidor: pega el markdown inline más abajo.
     ============================================================ -->
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>slidedown</title>

  <!-- Tema: tokens + estructura. Los temas se eligen con data-theme en <html>. -->
  <link rel="stylesheet" href="theme/tokens.css">
  <link rel="stylesheet" href="theme/themes/dark.css">
  <link rel="stylesheet" href="theme/themes/blueprint.css">
  <link rel="stylesheet" href="theme/base.css">
  <link rel="stylesheet" href="theme/layouts.css">
  <link rel="stylesheet" href="theme/transitions.css">
  <link rel="stylesheet" href="theme/diagrams.css">
  <link rel="stylesheet" href="theme/print.css">
  <!-- Overrides de ESTA presentación (no tocar temas para ajustar el aspecto) -->
  <link rel="stylesheet" href="custom.css">
</head>
<body>
  <!-- La presentación: apunta a slides.md (o a varios .md separados por comas). -->
  <sd-deck src="slides.md"></sd-deck>

  <!--
  <sd-deck>
    <script type="text/slidedown">
      # Contenido inline

      ---

      ## Segunda diapositiva
    </script>
  </sd-deck>
  -->

  <script src="lib/marked.min.js"></script>
  <script src="lib/slidedown.js"></script>
</body>
</html>
