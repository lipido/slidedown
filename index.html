<!DOCTYPE html>
<!-- ============================================================
     SLIDEDOWN — punto de entrada
     Para abrir una presentación: edita slides.md y sirve la web con
       cd framework && npm run serve   (autoreload incluido)
     y abre http://localhost:8000.
     Alternativa sin servidor: pega el markdown inline más abajo.
     ============================================================ -->
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>slidedown</title>

  <!-- Tema: tokens + estructura. Los temas se eligen con data-theme en <html>. -->
  <link rel="stylesheet" href="framework/theme/tokens.css">
  <link rel="stylesheet" href="framework/theme/themes/dark.css">
  <link rel="stylesheet" href="framework/theme/themes/blueprint.css">
  <link rel="stylesheet" href="framework/theme/base.css">
  <link rel="stylesheet" href="framework/theme/layouts.css">
  <link rel="stylesheet" href="framework/theme/transitions.css">
  <link rel="stylesheet" href="framework/theme/diagrams.css">
  <link rel="stylesheet" href="framework/theme/highlight.css">
  <link rel="stylesheet" href="framework/theme/print.css">
  <!-- Overrides de ESTA presentación (no tocar temas para ajustar el aspecto) -->
  <link rel="stylesheet" href="custom.css">
</head>
<body>
  <!-- La presentación: apunta a slides.md (o a varios .md separados por comas). -->
  <sd-deck src="slides.md"></sd-deck>

  <!--
  <sd-deck>
    <script type="text/slidedown">
      # Contenido inline

      ---

      ## Segunda diapositiva
    </script>
  </sd-deck>
  -->

  <script src="framework/lib/marked.min.js"></script>
  <script src="framework/lib/slidedown.js"></script>
</body>
</html>
